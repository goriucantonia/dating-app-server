# Demo profiles (S15-B4, data_hygiene.md §2).
#
# Each entry is a REAL account: the A1 form fields plus five baseline answers,
# seeded through the same code path a person's registration and answers take
# (app/accounts.py, app/answers.py), then read by the real extraction,
# persona and embedding pipeline. Nothing here is inserted as a trait, a
# snapshot or a vector directly — `is_demo: true` is the only difference, and
# it travels on every payload the person appears in.
#
# `email` is the stable seed key. Changing an answer here is an EDIT on the
# next boot (logged as one), which re-reads the profile like a person's edit
# would. The password is shared and public on purpose: demo accounts exist to
# be signed into.
#
# Every answer is at least 50 characters (the floor, §18) and written in a
# voice, because the persona learns the voice from the words (trade #1).
password: demo-password

