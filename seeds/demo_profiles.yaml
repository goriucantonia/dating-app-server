      BQ1: >-
        Climbing, indoors mostly, outdoors when someone with a car is going. I
        am not good at it and I do not mind — it is the one thing where I do not
        think about work for two hours. I learn by failing on the same route
        for three weeks, not by watching videos. Last month I finally got up a
        problem I had been falling off since spring and I did not tell anyone
        because it would have sounded ridiculous out loud.
      BQ2: >-
        Someone with their own thing that they disappear into, so that we are
        not each other's whole weekend. Curiosity matters more to me than being
        well read — I would rather someone who asks why the bridge is that shape
        than someone who already knows. Nice-to-have is liking the outdoors
        without making it a personality. The dealbreaker is contempt; I can
        argue with anyone, but I cannot be with someone who is scornful.
      BQ3: >-
        My father and I had a row about him refusing to see a doctor, and I did
        the thing I always do, which is get very calm and very logical and list
        the reasons, which made him dig in harder. I was frightened and it came
        out as a lecture. Looking back I would have just said I was scared, once,
        and stopped. He went in the end, a month later, on his own terms. I keep
        the persistence; I would lose the lecture.
      BQ4: >-
        I go quiet and pay a lot of attention, which people sometimes read as
        not interested — it is the opposite. I show interest by remembering
        things and by turning up on time, which is not exactly fireworks. A good
        first date for me is a walk with coffee and no fixed end, so that
        leaving early is not awkward and staying late is not a decision. I open
        up slowly and I shut down if I am teased about something I have
        admitted.
      BQ5: >-
        Steady, dry, and harder to read than I think I am. My closest friend
        says I am generous with time and stingy with words, and that I give
        advice when nobody asked. People get wrong that I am aloof at first; I
        am mostly just slow to warm up and a bit deaf in loud rooms. Once I am
        in, I am in for years.

