    answers:
      BQ1: >-
        I bake bread, and I mean the slow kind — a sourdough starter I have kept
        alive for three years and named, embarrassingly, Gerald. I read about
        hydration percentages the way other people read football tables, and I
        keep a notebook of every loaf with what went wrong. Last Sunday I did a
        rye that came out like a brick and I still ate half of it standing at
        the counter. It is mostly a solitary thing, but I give most of what I
        bake away, which is the part I actually like.
      BQ2: >-
        Someone who asks a second question. Most people ask one to be polite and
        then wait for their turn; I want the person who actually wants to know
        the answer to the second one. Nice-to-have: they cook, or at least they
        eat with enthusiasm. The dealbreaker is meanness dressed up as honesty —
        people who say cruel things and then say they are just being direct. I
        have dated that and I am done with it.
      BQ3: >-
        My flatmate left the kitchen a wreck for the fourth time in a fortnight
        and I did not say anything for two days, which is my real flaw — I go
        quiet and tidy it myself and resent her. When I finally said something
        it came out far too sharp and she cried. I apologised for the tone but
        not the point, and we made a rota, which has actually held. I would keep
        the rota and skip the two silent days.
      BQ4: >-
        I get talkative and a bit too funny, like I am auditioning. On a good
        first date I would rather do something than sit across a table — a
        market, a walk, anywhere we can comment on things instead of
        interviewing each other. I open up when the other person admits
        something small and unflattering first; I shut down completely if
        someone is rude to a waiter or checks their phone while I am mid
        sentence.
      BQ5: >-
        Warm, organised, and slightly bossy about it — I will hand you a plan
        before you asked for one. My friends would say I am the one who
        remembers birthdays and also the one who cannot let a wrong fact go by
        in a conversation. People assume I am always fine because I am cheerful,
        and they get that wrong; I am cheerful and also tired a lot of the time,
        and I would rather someone noticed.

