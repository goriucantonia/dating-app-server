[project]
name = "dating-app-server"
version = "0.1.0"
description = "AI dating app backend — module plans in the *.md files at repo root"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "jsonschema>=4.22",
    "httpx>=0.27",
    "google-genai>=1.0",
    "bcrypt>=4.1",
    "pyjwt>=2.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

# Explicit, because setuptools auto-discovery breaks the moment a second
# top-level directory (probes/, tests/) contains .py files — DEFECTS.md D-003.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# EXE002: through the Windows bind mount every file reads as executable —
# the finding is an artifact of the mount, not of the code.
ignore = ["EXE002"]

[tool.mypy]
strict = true
