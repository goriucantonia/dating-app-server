# The per-task routing config — verbatim shape from ai_interaction.md §3 (locked).
# Changing a model is an edit here, never a code change.
#
# `free-model-of-choice` slots are DELIBERATELY unfilled (owner decision,
# 2026-09-01). Startup logs every unresolved route. They are chosen after the
# quota-fit and fidelity-transfer gates, not before.

ai:
  providers:
    google:     { api_key_env: GOOGLE_AI_API_KEY }
    openrouter: { api_key_env: OPENROUTER_API_KEY }

  embeddings:                       # pinned SEPARATELY from chat models:
    provider: google                # every stored vector must come from the same model
    model: gemini-embedding-001     # or similarity comparisons are meaningless.
                                    # Changing this = migration + re-embed all users.
                                    # (REVISED 2026-09-01: the API rejected the spec's
                                    # text-embedding-004 as gone; zero vectors existed,
                                    # so the swap cost nothing. 768 dims requested
                                    # explicitly — see ai_interaction.md §3.)
  routing:
    # REVISED 2026-09-01 (owner decision, Step 6): gemini-3.6-flash is used for
    # NOTHING. Every chat/structured task routes to OpenRouter for now.
    #
    # New information that forced it: the google free tier behaves as a DAILY
    # cap (limit: 20 on generate_content_free_tier_requests) and did not clear
    # across a 75-second wait — it blocked Step 6's AC5 and AC6 witnesses
    # outright. A model that runs out for the day is not a model you can build
    # on. nvidia/nemotron-3.5-lightning:free is the free model that answered
    # cleanly in Step 2's probe (z-ai/glm-5.2:free was saturated and leaks
    # visible reasoning text into content).
    #
    # This is a PROVISIONAL pin exactly as the google one was — the final
    # model-tier choice still belongs to the quota-fit and fidelity gates.
    # Embeddings are pinned SEPARATELY below and are untouched by this: they
    # are gemini-embedding-001, a different model on a different quota, and
    # OpenRouter serves no embedding equivalent.
    # FILLED 2026-09-01 (owner decision, Step 6): dispute follow-ups are the
    # one AI-generated question type left in the system and Step 6's AC4 cannot
    # be witnessed without a model behind them. nvidia/nemotron-3.5-lightning
    # is the free model that answered cleanly in Step 2's probe (z-ai/glm-5.2
    # was saturated and leaks visible reasoning text into content). Keeping
    # this off google also keeps it clear of the gemini free tier, which the
    # extraction path already presses against at 20 requests/minute.
    # The REMAINING free-model-of-choice slots stay deliberately unfilled.
    dispute_followups:   { provider: openrouter, model: "dots-studio/dots-3-note-preview:free" }
    # trait_extraction is on a DIFFERENT model from the rest, deliberately
    # (2026-09-01, Step 7). dots-3-note-preview began answering every
    # trait_extraction request with an upstream `400 bad request` via
    # AtlasCloud, reproducibly, across three retries — while serving
    # persona_digest and chat_reply fine on the same key seconds apart, and
    # while plain calls to that same upstream succeeded. Per-task routing
    # exists so one task's broken provider does not force a global change.
    # nemotron-3-super is the other model that PASSED the Step 6 shootout
    # against this exact schema (19s). Its known cost: it writes full
    # sentences where a label should be short, and over-splits one answer
    # into several traits — a fidelity-gate concern (Step 8), not a
    # correctness one.
    #
    # UNEXPLAINED, 2026-09-01 (Step 11): this line was found in the working
    # tree pointing at dots-3-note-preview, uncommitted and undated, directly
    # under the paragraph above explaining why it is NOT dots. Nothing records
    # whether that was a re-measurement or a slip, and §23 says a revision
    # names its new information and its date. It is left as found rather than
    # reverted on a guess: dots served four trait_extraction calls cleanly on
    # 2026-09-01, so it is not currently broken for this task. The owner should
    # confirm which model is meant. Nothing in Step 11 depends on it.
    trait_extraction:    { provider: openrouter, model: "dots-studio/dots-3-note-preview:free" }
    persona_digest:      { provider: openrouter, model: "dots-studio/dots-3-note-preview:free" }
    # FILLED 2026-09-01 (Step 11): scenario generation is the first call of
    # every simulation, so with the slot empty S11-B2/B3 and Step 11's whole
    # acceptance list are unreachable — no scenario, no dates, no transcript.
    # Same model as the rest for the same measured reason: of the 18 free
    # OpenRouter models only four advertise structured_outputs, and of those
    # only dots-3-note-preview and nemotron-3-super passed the Step 6 shootout
    # against a real schema. dots is used here rather than nemotron because
    # this schema is a NESTED one (two settings, each with an array of 4-6
    # events) and dots produced the shorter, better-shaped output of the two.
    # If it starts 400ing the way it did for trait_extraction (D-008), move
    # THIS line — that is what per-task routing is for.
    # Provisional, like every pin above it: the tier choice belongs to the
    # quota-fit gate, which this step opens.
    scenario_generation: { provider: openrouter, model: "dots-studio/dots-3-note-preview:free" }
    # FILLED 2026-09-01 (Step 8): S8-G1, the fidelity-transfer gate, has to be
    # tested against the ACTUAL model dates will run on — a gate closed on a
    # different model than production uses proves nothing. Deliberately the
    # SAME model as chat_reply so calibration chat IS the date model,
    # satisfying the gate condition by construction rather than by a special
    # test path. Provisional; Step 11 revisits it with the quota-fit gate.
    date_simulation:     { provider: openrouter, model: "dots-studio/dots-3-note-preview:free" }
    judging:             { provider: openrouter, model: "dots-studio/dots-3-note-preview:free" }
    # FILLED 2026-09-01 (Step 7): calibration chat — "meet your AI self" —
    # runs on chat_reply, so S7-B8 and AC7 cannot be witnessed with the slot
    # empty. Same measured model as the rest; the owner's standing direction
    # is OpenRouter for everything for now. scenario_generation,
    # date_simulation and chat_compaction belong to Steps 11 and 14 and stay
    # unfilled until those steps need them.
    chat_reply:          { provider: openrouter, model: "dots-studio/dots-3-note-preview:free" }
    chat_compaction:     { provider: openrouter, model: "free-model-of-choice" }
